repos:
  # ------------------------------------------------------------------
  # Standard Hygiene Hooks
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ------------------------------------------------------------------
  # Secrets Detection
  # ------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ------------------------------------------------------------------
  # Markdown Linting
  # ------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # ------------------------------------------------------------------
  # Markdown Formatting (Prettier)
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier-markdown
        name: prettier (markdown)
        entry: npx prettier@3.5.3 --write --prose-wrap=always
        language: system
        types: [markdown]

  # ------------------------------------------------------------------
  # Spell Checking
  # ------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=crate,nd,te,ue,wil,bu
          - --skip="*.lock,*.log,go.sum,bin,dist"

  # ------------------------------------------------------------------
  # Go: Lint + Test
  # ------------------------------------------------------------------
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.0
    hooks:
      - id: golangci-lint-full
        name: golangci-lint
        # Keep package loading compatible with the cached Go 1.25-built linter.
        entry: env GOTOOLCHAIN=go1.25.8 golangci-lint run

  - repo: local
    hooks:
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        files: \.go$
        pass_filenames: false
