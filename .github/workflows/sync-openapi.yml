name: Retired OpenAPI Sync

# Keep the old workflow ID as an explicit, non-mutating manual failure.
# Backend must dispatch build-cli.yml at the matching main/unstable ref instead.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Reject legacy schema sync
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain replacement
        run: |
          echo 'OpenAPI sync is retired. Dispatch build-cli.yml with verified producer evidence at the matching CLI branch.'
          echo 'See docs/backend-cli-builds.md. No generated-code commit or branch push was performed.'
          exit 1
